name: Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/acceptance.yml"
      - "go.mod"
      - "go.sum"
      - "incidentrelay/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/acceptance.yml"
      - "go.mod"
      - "go.sum"
      - "incidentrelay/**"

permissions:
  contents: read
  packages: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "2.3"
            image: ghcr.io/roxy-wi/incidentrelay:2.3
            ref: v2.3.0
          - version: "2.4"
            # Build the final release tag for reproducible compatibility tests.
            image: ""
            ref: v2.4.0
    env:
      INCIDENTRELAY_REMOTE_IMAGE: ${{ matrix.image }}
      INCIDENTRELAY_IMAGE: incidentrelay-acc:${{ matrix.version }}
      INCIDENTRELAY_SOURCE_REF: ${{ matrix.ref }}
      INCIDENTRELAY_EXPECTED_VERSION: ${{ matrix.version }}
      INCIDENTRELAY_BASE_URL: http://127.0.0.1:8080
      INCIDENTRELAY_USERNAME: admin
      INCIDENTRELAY_PASSWORD: change-me-123
      INCIDENTRELAY_ACC: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Prepare IncidentRelay image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -n "$INCIDENTRELAY_REMOTE_IMAGE" ]; then
            echo "Trying anonymous pull of $INCIDENTRELAY_REMOTE_IMAGE"
            if docker pull "$INCIDENTRELAY_REMOTE_IMAGE"; then
              docker tag "$INCIDENTRELAY_REMOTE_IMAGE" "$INCIDENTRELAY_IMAGE"
              exit 0
            fi
            echo "Anonymous pull failed; retrying after GHCR login"
            if printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin; then
              if docker pull "$INCIDENTRELAY_REMOTE_IMAGE"; then
                docker tag "$INCIDENTRELAY_REMOTE_IMAGE" "$INCIDENTRELAY_IMAGE"
                exit 0
              fi
            fi
          fi

          echo "Building IncidentRelay from $INCIDENTRELAY_SOURCE_REF"
          git init .incidentrelay-source
          git -C .incidentrelay-source remote add origin https://github.com/roxy-wi/IncidentRelay.git
          git -C .incidentrelay-source fetch --depth 1 origin "$INCIDENTRELAY_SOURCE_REF"
          git -C .incidentrelay-source checkout --detach FETCH_HEAD

          docker build \
            -t "$INCIDENTRELAY_IMAGE" \
            -f .incidentrelay-source/docker/Dockerfile \
            .incidentrelay-source

      - name: Start IncidentRelay
        run: |
          docker run -d \
            --name incidentrelay-acc \
            -p 8080:8080 \
            -e INCIDENTRELAY_CONFIG_FILE=/etc/incidentrelay/incidentrelay.conf \
            -e INCIDENTRELAY_SERVICE=web \
            -e INCIDENTRELAY_RUN_MIGRATIONS=1 \
            -e INCIDENTRELAY_PORT=8080 \
            -e INCIDENTRELAY_WEB_WORKERS=1 \
            -e INCIDENTRELAY_WEB_THREADS=4 \
            -e INCIDENTRELAY_WEB_TIMEOUT=120 \
            "$INCIDENTRELAY_IMAGE"

      - name: Wait for IncidentRelay
        run: |
          for i in {1..60}; do
            if curl -fsS "$INCIDENTRELAY_BASE_URL/api/health" || curl -fsS "$INCIDENTRELAY_BASE_URL/login" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs incidentrelay-acc
          exit 1

      - name: Create admin user
        run: |
          docker exec \
            -e INCIDENTRELAY_CONFIG_FILE=/var/lib/incidentrelay/incidentrelay.conf \
            incidentrelay-acc \
            python manage.py create-admin \
              --username "$INCIDENTRELAY_USERNAME" \
              --password "$INCIDENTRELAY_PASSWORD" \
              --email admin@example.com

      - name: Run provider acceptance tests
        run: go test -run '^TestAcc' -count=1 ./incidentrelay

      - name: Dump IncidentRelay logs
        if: always()
        run: docker logs incidentrelay-acc || true

      - name: Stop IncidentRelay
        if: always()
        run: docker rm -f incidentrelay-acc || true
